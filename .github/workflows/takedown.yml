name: Remove free releases

# SNS Content Manager is now a paid app ($1.99). This removes every free release and tag.
on:
  push:
    branches: [main]
    paths: [".github/workflows/takedown.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  takedown:
    runs-on: ubuntu-latest
    steps:
      - name: Delete all releases and their tags
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          for t in $(gh release list --limit 100 --json tagName --jq '.[].tagName'); do
            gh release delete "$t" --yes --cleanup-tag
          done
          gh release list
